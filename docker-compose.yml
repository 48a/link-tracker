services:
  postgres:
    image:
      postgres:latest
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 56692
      POSTGRES_DB: storage

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    environment:
      APP_TELEGRAM_TOKEN: ""
    ports:
      - "8002:8002"

  scrapper:
    build:
      context: .
      dockerfile: Dockerfile.scrapper
    environment:
      DSN: "user=user password=56692 host=postgres port=5432 dbname=storage sslmode=disable"
    ports:
      - "8001:8001"
    depends_on:
      - postgres
