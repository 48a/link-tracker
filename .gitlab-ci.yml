variables:
  GO_VERSION: "1.25"
  GO_LINTER_VERSION: "v2.10"
  GOLANG_IMAGE: golang:${GO_VERSION}-alpine
  GOPATH: "$CI_PROJECT_DIR/.go"
  GITLAB_DOCKER_PROXY: gitlab.education.tbank.ru:443/backend-academy-go-2025/lecture-materials/dependency_proxy/containers

cache:
  paths:
    - .go/pkg/mod/

stages:
  - lint
  - test
  - build

lint:
  stage: lint
  image: golangci/golangci-lint:${GO_LINTER_VERSION}-alpine
  script:
    - golangci-lint run -c .golangci.yml --timeout=5m
  rules:
    - when: always

.test-base:
  stage: test
  image: ${GOLANG_IMAGE}
  tags:
    - dind
  services:
    - name: docker:24.0-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
    TESTCONTAINERS_RYUK_DISABLED: "true"
  before_script:
    - wget https://download.docker.com/linux/static/stable/x86_64/docker-24.0.9.tgz
    - tar xzvf docker-24.0.9.tgz
    - mv docker/docker /usr/bin/docker
    - rm -rf docker docker-24.0.9.tgz
    - echo "$CI_JOB_TOKEN" | docker login gitlab.education.tbank.ru:443 -u gitlab-ci-token --password-stdin
    - apk add --no-cache gcc musl-dev
  rules:
    - when: always

test_e2e_flow:
  extends: .test-base
  script:
    - docker pull ${GITLAB_DOCKER_PROXY}/postgres:17
    - docker tag ${GITLAB_DOCKER_PROXY}/postgres:17 postgres:17
  
    - echo "Building local/scrapper and local/bot..."
    - |
      (docker build -t local/scrapper:latest -f Dockerfile.scrapper .) &
      (docker build -t local/bot:latest -f Dockerfile.bot .) &
      wait

    - go test -race -run ^TestE2EFlow$ -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out
  coverage: '/total:\s+\(statements\)\s+(\d+.\d+)%/'

test_scrapper_kafka_bot:
  extends: .test-base
  script:
    - |
      (docker pull ${GITLAB_DOCKER_PROXY}/postgres:17 && docker tag ${GITLAB_DOCKER_PROXY}/postgres:17 postgres:17) &
      (docker pull ${GITLAB_DOCKER_PROXY}/bitnamilegacy/kafka:4.0.0 && docker tag ${GITLAB_DOCKER_PROXY}/bitnamilegacy/kafka:4.0.0 bitnamilegacy/kafka:4.0.0) &
      (docker pull ${GITLAB_DOCKER_PROXY}/confluentinc/cp-schema-registry:7.5.0 && docker tag ${GITLAB_DOCKER_PROXY}/confluentinc/cp-schema-registry:7.5.0 confluentinc/cp-schema-registry:7.5.0) &
      wait

    - echo "Building local/scrapper and local/bot..."
    - |
      (docker build -t local/scrapper:latest -f Dockerfile.scrapper .) &
      (docker build -t local/bot:latest -f Dockerfile.bot .) &
      wait
      
    - go test -race -run ^TestScrapperKafkaBotFlow$ -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out
  coverage: '/total:\s+\(statements\)\s+(\d+.\d+)%/'

test_agent_kafka:
  extends: .test-base
  script:
    - docker pull ${GITLAB_DOCKER_PROXY}/confluentinc/confluent-local:7.5.0
    - docker tag ${GITLAB_DOCKER_PROXY}/confluentinc/confluent-local:7.5.0 confluentinc/confluent-local:7.5.0
    
    - go test -race -run ^TestAgentKafkaIntegration$ -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out
  coverage: '/total:\s+\(statements\)\s+(\d+.\d+)%/'

test_other:
  extends: .test-base
  script:
    - |
      (docker pull ${GITLAB_DOCKER_PROXY}/postgres:15-alpine && docker tag ${GITLAB_DOCKER_PROXY}/postgres:15-alpine postgres:15-alpine) &
      (docker pull ${GITLAB_DOCKER_PROXY}/valkey/valkey:latest && docker tag ${GITLAB_DOCKER_PROXY}/valkey/valkey:latest valkey/valkey:latest) &
      wait
      
    - go test -race -skip "^(TestE2EFlow|TestScrapperKafkaBotFlow|TestAgentKafkaIntegration)$" -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out
  coverage: '/total:\s+\(statements\)\s+(\d+.\d+)%/'

build:
  stage: build
  image: ${GOLANG_IMAGE}
  script:
    - mkdir -p bin
    - for d in cmd/*; do
      name="$(basename "$d")";
      echo "Building $name";
      go build -o "bin/$name" "./cmd/$name";
      done
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: "$CI_COMMIT_BRANCH =~ /^(master|main)$/"
    - when: never